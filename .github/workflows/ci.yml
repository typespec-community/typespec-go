name: CI

on:
  push:
    branches: [main, lars/lets-rock]
  pull_request:
    branches: [main, lars/lets-rock]

jobs:
  build-and-test:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Alloy-JS components
        run: bun run build
        env:
          CI: true

      - name: Run test suite
        run: bun run test:typespec
        env:
          CI: true

      - name: Run ESLint
        run: bun run lint
        env:
          CI: true

      - name: TypeScript type checking
        run: bun run build:check
        env:
          CI: true

      - name: Format check
        run: bun run format --check
        continue-on-error: true
        env:
          CI: true

      - name: Format check (dprint)
        run: bun run format:check
        env:
          CI: true

      - name: CLI end-to-end proof
        run: bun run test:e2e-cli
        env:
          CI: true

      - name: Docs gates
        continue-on-error: true
        env:
          CI: true
        run: |
          go install github.com/Artmann-Technologies/docs-gates@2adbc73
          "$(go env GOPATH)/bin/docs-gates" run .

      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7
