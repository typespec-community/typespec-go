name: CI

on:
  push:
    branches: [main, lars/lets-rock]
  pull_request:
    branches: [main, lars/lets-rock]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Alloy-JS components
        run: bun run build
        env:
          CI: true

      - name: Run test suite
        run: bun run test:typespec
        env:
          CI: true

      - name: Run ESLint
        run: bun run lint
        env:
          CI: true

      - name: TypeScript type checking
        run: bun run build:check
        env:
          CI: true

      - name: Format check
        run: bun run format --check
        continue-on-error: true
        env:
          CI: true

      - name: Format check (dprint)
        run: bun run format:check
        env:
          CI: true

      - name: CLI end-to-end proof
        run: bun run test:e2e-cli
        env:
          CI: true

      - name: Docs gates
        continue-on-error: true
        env:
          CI: true
        run: |
          go install github.com/Artmann-Technologies/docs-gates@2adbc73
          "$(go env GOPATH)/bin/docs-gates" run .

      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
