[settings]
quiet = true

[tools]
node = "25.1.0"
watchexec = "2.3.2"

[tasks.build]
description = "Build the emitter"
run = ["npm run build"]

[tasks.test]
description = "Run tests"
run = ["npm run test:typespec"]

[tasks.dev]
description = "Run the development servers and workers"
depends = ["dev:main"]

[tasks."dev:main"]
hide = true
run = [
  "mise watch --watch=./src --watch=./lib --stop-signal=SIGKILL --stop-timeout=0 --restart build",
]

